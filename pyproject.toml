[project]
name = "polymarket-smart-money"
version = "0.1.0"
description = "Polymarket smart-money discovery, scoring, strategy inference, and signal service."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "apscheduler>=3.10",
  "asyncpg>=0.29",
  "fastapi>=0.115",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "prometheus-client>=0.20",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "redis>=5.0",
  "scikit-learn>=1.5",
  "sqlalchemy>=2.0",
  "structlog>=24.2",
  "uvicorn[standard]>=0.30",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501", "UP042"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
